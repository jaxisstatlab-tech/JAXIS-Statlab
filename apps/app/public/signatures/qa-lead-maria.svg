<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 140" width="450" height="140">
  <defs>
    <filter id="ink-bleed" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="0.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="#0B1B36" stroke-linecap="round" stroke-linejoin="round" filter="url(#ink-bleed)">
    <!-- Capital M: starting upstroke, sharp crest, steep plunge, rounded loop, graceful second peak -->
    <path d="M 32 98 C 38 88, 48 52, 60 28 C 64 20, 68 18, 71 22 C 75 28, 71 46, 65 72 C 59 96, 55 106, 54 108 C 53 111, 57 110, 64 98 C 76 76, 94 42, 108 32 C 114 27, 118 29, 117 38 C 114 58, 108 86, 106 102" stroke-width="3.8"/>
    
    <!-- Cursive 'a' into 'r': loopback oval with fluid connection -->
    <path d="M 106 102 C 112 88, 126 72, 138 72 C 148 72, 145 84, 136 92 C 126 100, 116 95, 120 84 C 124 73, 138 70, 148 74 C 156 77, 162 72, 168 66" stroke-width="2.6"/>
    
    <!-- Cursive 'i' into 'a' -->
    <path d="M 168 66 C 174 60, 182 64, 182 74 C 182 86, 178 94, 188 92 C 196 90, 204 78, 214 68 C 224 58, 234 65, 230 80 C 225 96, 212 98, 222 96 C 230 94, 244 76, 256 60" stroke-width="2.8"/>
    
    <!-- Cursive flourish / surname initial 'S' / executive undersweep -->
    <path d="M 256 60 C 268 44, 288 30, 304 26 C 314 23, 318 28, 312 40 C 295 72, 266 98, 238 110 C 196 128, 130 128, 72 122 C 45 119, 25 112, 18 108" stroke-width="3.4"/>
    
    <!-- Diacritic ink tick over 'i' -->
    <path d="M 183 48 C 187 45, 192 44, 197 46" stroke-width="3.0"/>
  </g>
</svg>