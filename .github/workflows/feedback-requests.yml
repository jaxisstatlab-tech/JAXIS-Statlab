name: Client feedback requests

# Once a day: ask clients of newly finished studies how it went, and send the one reminder 3 days later.
# The app does the work (apps/app/src/features/feedback/requests.ts); this just calls it.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   APP_URL      the live app address, e.g. https://app.jaxis-statlab.com
#   CRON_SECRET  the same value as the app's CRON_SECRET environment variable on the host

on:
  schedule:
    - cron: "0 1 * * *" # 9:00 AM Philippine time
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask and remind
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not set; skipping." && exit 0
          fi
          curl --fail-with-body -sS -X POST "${APP_URL%/}/api/v1/crons/feedback-requests" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json"
